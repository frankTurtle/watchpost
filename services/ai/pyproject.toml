[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchpost-ai"
version = "0.1.0"
description = "AI-powered status summaries for Watchpost uptime monitor"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "anthropic>=0.90",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
